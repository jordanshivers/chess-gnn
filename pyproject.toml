[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-gnn"
version = "0.0.1"
description = "A message-passing GNN that plays chess."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "python-chess>=1.10",
    "numpy>=1.26",
    "zstandard>=0.22",
    "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "gradio>=4.0", "jupyter", "Pillow>=10.0"]
web = ["flask>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
